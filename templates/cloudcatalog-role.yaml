AWSTemplateFormatVersion: '2010-09-09'
Description: 'Cloud Catalog 1-Click AWS Cross-Account Billing & Profile Ingestion IAM Role'

Parameters:
  SaaSAccountId:
    Type: String
    Default: '582983022238'
    Description: 'The Cloud Catalog SaaS Platform AWS Account ID authorized to assume this read-only role.'
  ExternalId:
    Type: String
    Description: 'Unique tenant UUID generated by Cloud Catalog to prevent Confused Deputy attacks.'

Resources:
  CloudCatalogCostSyncRole:
    Type: 'AWS::IAM::Role'
    Properties:
      RoleName: !Sub 'CloudCatalog-CostSync-Role-${ExternalId}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${SaaSAccountId}:root'
            Action:
              - 'sts:AssumeRole'
            Condition:
              StringEquals:
                'sts:ExternalId': !Ref ExternalId
      Policies:
        - PolicyName: CloudCatalogBillingReadOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'ce:GetCostAndUsage'
                  - 'ce:GetCostForecast'
                  - 'ce:GetDimensionValues'
                  - 'ce:GetTags'
                  - 'account:GetContactInformation'
                Resource: '*'

Outputs:
  RoleArn:
    Description: 'The ARN of the created Cloud Catalog Cost Sync IAM Role'
    Value: !GetAtt CloudCatalogCostSyncRole.Arn
